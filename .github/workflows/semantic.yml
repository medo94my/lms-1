name: Semantic Pull Request

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  semantic:
    name: Validate PR title
    runs-on: ubuntu-latest

    steps:
      # Validate that the PR title follows Conventional Commits. Replaces the
      # unmaintained zeke/semantic-pull-requests action, which GitHub can no
      # longer resolve ("Can't find 'action.yml'"), causing this check to fail
      # on every PR. amannn/action-semantic-pull-request is its maintained
      # successor and only needs PR context (no checkout).
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
